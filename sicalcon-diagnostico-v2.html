<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico SICALCON</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --paper: #eef1f0;
    --paper-raised: #ffffff;
    --ink: #262e35;
    --ink-soft: #5b6570;
    --line: #d7dcd9;
    --clima: #1f7a8c;
    --clima-soft: #e4eef0;
    --calor: #b6552a;
    --calor-soft: #f4e8de;
    --obra: #86754f;
    --obra-soft: #ece6d7;
    --accent: #1f7a8c;
    --accent-soft: #e4eef0;
    --focus: #1f7a8c;
    --shadow: 0 1px 2px rgba(38,46,53,0.06), 0 8px 24px -12px rgba(38,46,53,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #1b2024; --paper-raised: #232a2f; --ink: #eef1ee; --ink-soft: #a9b2b6; --line: #333d41;
      --clima: #5fb8c9; --clima-soft: #223338; --calor: #e08a54; --calor-soft: #362920;
      --obra: #cdb885; --obra-soft: #33301f; --accent: #5fb8c9; --accent-soft: #223338; --focus: #5fb8c9;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --paper: #1b2024; --paper-raised: #232a2f; --ink: #eef1ee; --ink-soft: #a9b2b6; --line: #333d41;
    --clima: #5fb8c9; --clima-soft: #223338; --calor: #e08a54; --calor-soft: #362920;
    --obra: #cdb885; --obra-soft: #33301f; --accent: #5fb8c9; --accent-soft: #223338; --focus: #5fb8c9;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -14px rgba(0,0,0,0.55);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    transition: background .4s ease;
  }
  h1,h2{ font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0; line-height:1.12; }
  p{ line-height:1.6; margin:0; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:3px; border-radius:6px; }
  button{ font:inherit; }

  .wrap{ width:100%; max-width: 560px; margin-inline:auto; padding-inline: 20px; }

  /* ---- minimal header ---- */
  header{ padding-block: 18px; }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-badge{
    width:34px; height:34px; border-radius:9px; background:#f2f2f0;
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none;
    box-shadow: var(--shadow);
  }
  .brand-badge img{ width:90%; height:90%; object-fit:contain; }
  .brand-name{ font-family:"Fraunces",serif; font-weight:600; font-size:0.98rem; }
  .back-link{
    font-size:0.82rem; color:var(--ink-soft); text-decoration:none;
    display:flex; align-items:center; gap:5px;
  }
  .back-link:hover{ color:var(--ink); }
  .back-link svg{ width:14px; height:14px; }

  /* ---- main stage ---- */
  main{ flex:1; display:flex; align-items:center; }
  .stage{ width:100%; padding-block: 28px 56px; }

  .progress{
    display:flex; gap:6px; margin-bottom: 28px;
  }
  .progress i{
    flex:1; height:3px; border-radius:2px; background: var(--line);
    transition: background .3s ease;
  }
  .progress i.done{ background: var(--accent); }

  .eyebrow{
    font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:0.7rem;
    letter-spacing:0.12em; text-transform:uppercase; color: var(--ink-soft);
    margin-bottom: 10px; display:block;
  }

  .card{ animation: rise .35s ease both; }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }

  .question h2{ font-size: clamp(1.35rem, 4.5vw, 1.65rem); margin-bottom: 22px; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; background: var(--paper-raised);
    border:1px solid var(--line); border-radius:14px; padding: 16px 18px;
    cursor:pointer; box-shadow: var(--shadow); color:var(--ink);
    transition: transform .12s ease, border-color .12s ease;
  }
  .option:hover{ transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .option span.txt{ font-size:0.98rem; font-weight:500; }
  .option svg.arrow{ width:18px; height:18px; flex:none; color: var(--accent); opacity:0.7; }

  .stage-footer{ display:flex; justify-content:space-between; align-items:center; margin-top: 22px; }
  .txt-btn{
    background:none; border:none; color: var(--ink-soft); font-size:0.85rem;
    cursor:pointer; padding:6px 2px; display:flex; align-items:center; gap:5px;
  }
  .txt-btn:hover{ color: var(--ink); }
  .txt-btn svg{ width:15px; height:15px; }
  .txt-btn[hidden]{ visibility:hidden; }

  /* ---- result screen ---- */
  .result-badge{
    width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    margin-bottom:18px; background: var(--accent-soft); color: var(--accent);
  }
  .result-badge svg{ width:30px; height:30px; }
  .result h2{ font-size: clamp(1.5rem, 5vw, 1.9rem); margin-bottom:10px; }
  .result p.desc{ color: var(--ink-soft); font-size:1rem; max-width: 46ch; margin-bottom: 22px; }

  .summary{
    background: var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    padding: 14px 16px; margin-bottom: 24px; display:flex; flex-direction:column; gap:6px;
  }
  .summary-label{ font-family:"IBM Plex Mono",monospace; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); }
  .summary-trail{ font-size:0.88rem; color: var(--ink); }
  .summary-trail b{ color: var(--accent); }

  .btn{
    display:inline-flex; align-items:center; gap:9px; font-weight:600; font-size:1rem;
    text-decoration:none; padding: 15px 22px; border-radius:999px; border:none;
    cursor:pointer; width:100%; justify-content:center;
    box-shadow: var(--shadow); transition: transform .15s ease;
  }
  .btn:hover{ transform: translateY(-1px); }
  .btn svg{ width:20px; height:20px; flex:none; }
  .btn-whatsapp{ background:#22885f; color:#fff; }
  .btn-whatsapp:hover{ background:#1d7550; }

  .restart-row{ display:flex; justify-content:center; margin-top:18px; }

  footer{ padding-block: 20px; text-align:center; }
  footer small{ color: var(--ink-soft); font-size:0.76rem; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .card{ animation:none; }
    .option, .btn{ transition:none; }
  }
</style>
</head>

  function setAccent(accent){
    const map = { clima:'--clima', calor:'--calor', obra:'--obra', accent:'--accent' };
    const softMap = { clima:'--clima-soft', calor:'--calor-soft', obra:'--obra-soft', accent:'--accent-soft' };
    const root = document.documentElement;
    if (accent && map[accent]){
      root.style.setProperty('--accent', 'var(' + map[accent] + ')');
      root.style.setProperty('--accent-soft', 'var(' + softMap[accent] + ')');
    }
  }

  function renderProgress(stepIndex){
    progressEl.innerHTML = '';
    for(let i=0;i<TOTAL_STEPS;i++){
      const i_el = document.createElement('i');
      if (i < stepIndex) i_el.className = 'done';
      progressEl.appendChild(i_el);
    }
  }

  function renderQuestion(nodeId){
    const node = NODES[nodeId];
    const stepIndex = history.length; // 0,1,2...
    renderProgress(Math.min(stepIndex, TOTAL_STEPS));

    const optsHtml = node.options.map((opt, i) => (
      '<button class="option" data-idx="' + i + '">' +
        '<span class="txt">' + opt.label + '</span>' + ARROW +
      '</button>'
    )).join('');

    cardEl.innerHTML =
      '<div class="question card">' +
        '<span class="eyebrow">' + node.eyebrow + '</span>' +
        '<h2>' + node.title + '</h2>' +
        '<div class="options">' + optsHtml + '</div>' +
        '<div class="stage-footer">' +
          '<button class="txt-btn" id="btn-back"' + (history.length===0?' hidden':'') + '>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Atrás' +
          '</button>' +
          '<button class="txt-btn" id="btn-restart"' + (history.length===0?' hidden':'') + '>Reiniciar</button>' +
        '</div>' +
      '</div>';

    node.options.forEach((opt, i) => {
      cardEl.querySelector('[data-idx="'+i+'"]').addEventListener('click', function(){
        history.push({ nodeId: nodeId, tag: opt.tag, accent: opt.accent });
        setAccent(opt.accent);
        go(opt.next);
      });
    });
    const backBtn = document.getElementById('btn-back');
    if (backBtn) backBtn.addEventListener('click', goBack);
    const restartBtn = document.getElementById('btn-restart');
    if (restartBtn) restartBtn.addEventListener('click', restart);
  }

  function renderResult(nodeId){
    const node = NODES[nodeId];
    renderProgress(TOTAL_STEPS);
    setAccent(node.icon === 'general' ? 'accent' : node.icon);

    const trail = history.map(h => h.tag).join(' <span style="color:var(--ink-soft)">→</span> ');
    const message = "Hola, vengo del diagnóstico de la web y esto es lo que indiqué: " +
      history.map(h => h.tag).join(' > ') + ". ¿Podrían ayudarme?";
    const waUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);

    cardEl.innerHTML =
      '<div class="result card">' +
        '<span class="result-badge">' + (ICONS[node.icon] || ICONS.general) + '</span>' +
        '<h2>' + node.title + '</h2>' +
        '<p class="desc">' + node.desc + '</p>' +
        '<div class="summary">' +
          '<span class="summary-label">Tu diagnóstico</span>' +
          '<span class="summary-trail">' + trail + '</span>' +
        '</div>' +
        '<a class="btn btn-whatsapp" href="' + waUrl + '" target="_blank" rel="noopener">' + WA_ICON + ' Continuar por WhatsApp</a>' +
        '<div class="restart-row"><button class="txt-btn" id="btn-restart-2">Volver a empezar</button></div>' +
      '</div>';

    document.getElementById('btn-restart-2').addEventListener('click', restart);
  }

  function go(nodeId){
    const node = NODES[nodeId];
    if (node.type === 'result') renderResult(nodeId);
    else renderQuestion(nodeId);
  }

  function goBack(){
    if (history.length === 0) return;
    const last = history.pop();
    setAccent(history.length ? history[history.length-1].accent : null);
    if (history.length === 0){
      document.documentElement.style.removeProperty('--accent');
      document.documentElement.style.removeProperty('--accent-soft');
      renderQuestion('start');
    } else {
      renderQuestion(last.nodeId);
    }
  }

  function restart(){
    history = [];
    document.documentElement.style.removeProperty('--accent');
    document.documentElement.style.removeProperty('--accent-soft');
    renderQuestion('start');
  }

  document.getElementById('brand-link').addEventListener('click', function(e){
    e.preventDefault();
    restart();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  renderQuestion('start');
})();
</script>

</body>
</html>
